name: CI

on:
  push:
  pull_request:

jobs:
  portable-c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  validation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target aerakia_validation_runner aerakia_static_imu_calibration_cli
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run deterministic comparison suite
        run: >-
          python validation/run_suite.py
          --runner build/aerakia_validation_runner
          --out-dir build/validation
          --scenarios clean_motion,mag_spike,mag_bias,cold_start_tilted,navigation_outage,trusted_heading_recovery,bias_convergence
          --duration 20 --rate 100 --seed 7
      - name: Check accuracy and fault-response thresholds
        run: >-
          python validation/check_thresholds.py
          build/validation/summary.json
          --thresholds validation/thresholds.json
      - name: Check multi-rate accuracy invariance
        run: >-
          python validation/run_multirate_accuracy.py
          --runner build/aerakia_validation_runner
          --out-dir build/multirate-accuracy
      - name: Run CI Monte Carlo smoke gate
        run: >-
          python validation/run_monte_carlo.py
          --runner build/aerakia_validation_runner
          --out-dir build/monte-carlo-ci
          --seeds 0:20 --jobs 4 --compact
      - uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            build/validation
            build/multirate-accuracy/report.md
            build/multirate-accuracy/summary.json
            build/monte-carlo-ci/report.md
            build/monte-carlo-ci/summary.json

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DAERAKIA_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitized --parallel
      - name: Run sanitized C tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure
