name: CI

on:
  push:
  pull_request:

jobs:
  portable-c:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  validation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target aerakia_validation_runner
      - name: Run deterministic comparison suite
        run: >-
          python validation/run_suite.py
          --runner build/aerakia_validation_runner
          --out-dir build/validation
          --scenarios clean_motion,mag_spike,mag_bias,cold_start_tilted
          --duration 8 --rate 100 --seed 7
      - name: Check accuracy and fault-response thresholds
        run: >-
          python validation/check_thresholds.py
          build/validation/summary.json
          --thresholds validation/thresholds.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: build/validation
