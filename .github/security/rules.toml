title = "Public repository secrets and privacy review"

[extend]
useDefault = true

[[rules]]
id = "privacy-email"
description = "Email address: review whether publication is intentional"
regex = '''(?i)\b[a-z0-9][a-z0-9._%+\-]{0,63}@[a-z0-9][a-z0-9.\-]*\.[a-z]{2,24}\b'''
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)@(users\.)?noreply\.github\.com\b''', '''(?i)@(?:[^@\s]+\.)?(?:example\.(?:com|org|net)|test\.invalid)\b''']

[[rules]]
id = "privacy-cn-mobile"
description = "Potential mainland China mobile number"
regex = '''(?:^|[^0-9a-zA-Z.])((?:\+?86[ -]?)?1[3-9][0-9]{9})(?:$|[^0-9a-zA-Z.])'''
secretGroup = 1

[[rules]]
id = "privacy-phone-context"
description = "Phone number beside a contact field"
regex = '''(?i)(?:phone|mobile|telephone|tel|手机|电话|联系电话)["'\s:=：]{1,10}(\+?[0-9][0-9 ()\-]{6,23}[0-9])'''
secretGroup = 1

[[rules]]
id = "privacy-cn-id"
description = "Potential Chinese identity document number; requires review"
regex = '''\b[1-9][0-9]{5}(?:18|19|20)[0-9]{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])[0-9]{3}[0-9Xx]\b'''

[[rules]]
id = "privacy-address-context"
description = "Physical or mailing address field"
regex = '''(?im)(?:home[_ -]?address|shipping[_ -]?address|mailing[_ -]?address|street[_ -]?address|住址|家庭地址|收货地址|收件地址|通讯地址|联系地址)["'\t ]{0,8}[:=：]["'\t ]{0,8}([^\r\n<>]{6,160})'''
secretGroup = 1

[[rules]]
id = "privacy-cn-street-address"
description = "Potential Chinese street address"
regex = '''[\p{Han}]{2,12}(?:省|市|自治区)[\p{Han}0-9]{2,35}(?:路|街|巷|弄|村)[\p{Han}0-9\-]{0,16}[0-9]{1,6}号'''

[[rules]]
id = "privacy-local-user-path"
description = "Local filesystem path exposing a user account"
regex = '''(?:/Users/|/home/|[A-Za-z]:\\Users\\)([A-Za-z0-9_\p{Han}][A-Za-z0-9_.\p{Han}-]{1,63})'''
secretGroup = 1
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^(?:runner|root|user|username|example|yourname|your-user|USER|Public|Default|test|ubuntu|node|vscode)$''']

[[rules]]
id = "privacy-private-ip"
description = "Private network address: review infrastructure exposure"
regex = '''\b(?:10\.[0-9]{1,3}|192\.168|172\.(?:1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}\b'''

[[rules]]
id = "privacy-location-context"
description = "Precise coordinate field"
regex = '''(?i)(?:latitude|longitude|经度|纬度)["'\s:=：]{1,10}(-?[0-9]{1,3}\.[0-9]{5,12})'''
secretGroup = 1

[[rules]]
id = "privacy-person-context"
description = "Name in a recipient or emergency-contact field"
regex = '''(?im)(?:收件人|收货人|紧急联系人|emergency[_ -]?contact|recipient[_ -]?name)["'\t ]{0,8}[:=：]["'\t ]{0,8}([^\r\n<>]{2,60})'''
secretGroup = 1
